[package]
name = "bootstrap"
version = "0.1.0"
edition = "2021"

[dependencies]
askama = "0.14.0"
aws-config = "1.8.8"
aws-sdk-dynamodb = "1.96.0"
lambda_http = "0.13.0"
minify-html = "0.18.1"
reqwest = { version = "0.12.24", features = ["json", "native-tls-vendored"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

tokio = { version = "1", features = ["macros"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"